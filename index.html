{% extends 'base.html' %}

{% block content %}
<main class="admin-main">
    <div class="admin-container">
        <!-- Encabezado del Panel -->
        <div class="admin-header">
            <h1 class="admin-title">PANEL DE CONTROL FRACTAL</h1>
            <p class="admin-subtitle">Gestión de Nodos y Sincronización de Aprendices</p>
            <div class="admin-stats">
                <div class="stat-box">
                    <span class="stat-val" id="total-users">0 / 10</span>
                    <span class="stat-label">Nodos Sincronizados</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val" id="system-status" style="color: #4ade80;">EN LÍNEA</span>
                    <span class="stat-label" id="last-sync-label">Escaneo: Activo</span>
                </div>
            </div>
        </div>

        <!-- Matriz de 10 Nodos (Slots) -->
        <div class="user-grid" id="user-list">
            <!-- Se generarán 10 tarjetas automáticamente -->
            <div class="loading-pulse">
                <div class="spinner"></div>
                <p>Inicializando matriz de 10 nodos...</p>
            </div>
        </div>
    </div>
</main>

<style>
    /* Estilos Específicos del Admin */
    .admin-main {
        min-height: 100vh;
        padding: 120px 20px 50px;
        background: radial-gradient(circle at 50% 10%, #1a1a2e 0%, #000 80%);
        position: relative;
        z-index: 10;
    }

    .admin-container { max-width: 1200px; margin: 0 auto; }
    .admin-header { text-align: center; margin-bottom: 60px; animation: fadeInDown 1s ease-out; }
    .admin-title { font-size: 2.5rem; color: #fff; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 10px; text-shadow: 0 0 20px rgba(0, 255, 255, 0.6); background: linear-gradient(90deg, #fff, #00ffff, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .admin-subtitle { color: rgba(255, 255, 255, 0.6); font-family: monospace; letter-spacing: 0.1em; }
    .admin-stats { display: flex; justify-content: center; gap: 30px; margin-top: 30px; }
    
    .stat-box { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 15px 30px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; min-width: 180px; }
    .stat-val { font-size: 1.5rem; font-weight: bold; color: #00ffff; font-family: 'Orbitron'; transition: all 0.3s; }
    .stat-label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; margin-top: 5px; letter-spacing: 1px; }

    /* GRID DE TARJETAS */
    .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }

    /* ESTILO: TARJETA ACTIVA (Usuario Registrado) */
    .user-card { 
        background: rgba(15, 15, 30, 0.95); 
        border: 1px solid rgba(0, 255, 255, 0.2); 
        border-radius: 16px; 
        padding: 25px; 
        backdrop-filter: blur(10px); 
        position: relative; 
        overflow: hidden; 
        display: flex; 
        flex-direction: column; 
        min-height: 300px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .user-card:hover { transform: translateY(-5px); border-color: rgba(0, 255, 255, 0.6); box-shadow: 0 10px 30px rgba(0, 255, 255, 0.15); }
    
    /* Barra lateral de color */
    .user-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--node-color, #888); box-shadow: 0 0 15px var(--node-color, #888); }
    
    /* Admin Supremo */
    .user-card.master-card { border: 1px solid rgba(255, 215, 0, 0.4); background: linear-gradient(180deg, rgba(255, 215, 0, 0.05) 0%, rgba(10, 10, 20, 0.95) 100%); }
    .user-card.master-card::before { background: #ffd700; box-shadow: 0 0 20px #ffd700; }

    /* ESTILO: TARJETA VACANTE (Slot vacío) */
    .user-card.vacant {
        background: rgba(255, 255, 255, 0.02);
        border: 1px dashed rgba(255, 255, 255, 0.1);
        justify-content: center;
        align-items: center;
        text-align: center;
        opacity: 0.6;
    }
    .user-card.vacant::before { display: none; }
    .vacant-icon { font-size: 2rem; color: #333; margin-bottom: 10px; animation: pulse 2s infinite; }
    .vacant-text { font-family: monospace; color: #555; font-size: 0.8rem; letter-spacing: 2px; font-weight: bold; }
    .vacant-sub { font-size: 0.6rem; color: #333; margin-top: 5px; text-transform: uppercase; }

    /* Elementos Internos */
    .card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    
    .card-avatar { 
        width: 50px; height: 50px; border-radius: 50%; background: #222; 
        display: flex; align-items: center; justify-content: center; 
        font-weight: bold; color: #fff; overflow: hidden;
        border: 2px solid var(--node-color, #888); 
    }
    .card-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .user-info { flex: 1; overflow: hidden; }
    .card-name { font-family: 'Orbitron'; font-size: 0.85rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-email { font-size: 0.7rem; color: #888; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .card-body { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    
    .node-badge-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .node-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 800; letter-spacing: 0.1em; background: rgba(255, 255, 255, 0.05); color: var(--node-color, #fff); border: 1px solid var(--node-color, #fff); }
    .role-desc { font-size: 0.75rem; color: #ccc; min-height: 2.5em; line-height: 1.4; }

    .admin-controls { margin-top: auto; }
    .control-label { display: block; font-size: 0.6rem; color: #666; margin-bottom: 5px; text-transform: uppercase; }
    
    .role-select { width: 100%; background: #050505; color: #fff; border: 1px solid #333; padding: 8px; border-radius: 6px; font-family: 'Courier New', monospace; font-size: 0.75rem; cursor: pointer; transition: 0.3s; outline: none; }
    .role-select:hover { border-color: #00ffff; }
    
    .btn-save { width: 100%; margin-top: 10px; padding: 8px; background: transparent; border: 1px dashed rgba(0, 255, 255, 0.3); color: rgba(0, 255, 255, 0.5); font-family: 'Orbitron'; font-size: 0.65rem; border-radius: 6px; cursor: not-allowed; transition: 0.3s; }
    .btn-save.active { opacity: 1; pointer-events: all; background: rgba(0, 255, 255, 0.15); border: 1px solid #00ffff; color: #00ffff; cursor: pointer; }
    .btn-save.active:hover { background: #00ffff; color: #000; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }

    .loading-pulse { grid-column: 1 / -1; text-align: center; color: #00ffff; margin-top: 50px; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(0, 255, 255, 0.1); border-top-color: #00ffff; border-radius: 50%; margin: 0 auto 15px; animation: spin 1s linear infinite; }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 0.8; } 100% { opacity: 0.3; } }
    .syncing-effect { animation: pulse 1s infinite; color: #00ffff !important; }
</style>

<script>
    const MAX_SLOTS = 10; // 10 Nodos Fijos
    let lastDataHash = "";

    document.addEventListener('DOMContentLoaded', () => {
        loadUsers();
        // Polling cada 3 segundos para actualización en tiempo real
        setInterval(loadUsers, 3000);
    });

    async function loadUsers() {
        const systemStatus = document.getElementById('system-status');
        const syncLabel = document.getElementById('last-sync-label');
        
        try {
            systemStatus.classList.add('syncing-effect');
            
            // Construcción robusta de la URL
            const baseUrl = window.location.origin;
            const timestamp = new Date().getTime();
            const apiUrl = `${baseUrl}/api/admin/users?t=${timestamp}`;

            const response = await fetch(apiUrl);
            
            if (!response.ok) {
                if(response.status === 403) throw new Error("Acceso Restringido");
                throw new Error("Servidor Offline");
            }

            const users = await response.json();
            const currentHash = JSON.stringify(users);
            
            // Si no hay cambios, solo actualizamos el estado visual y salimos
            if (currentHash === lastDataHash) {
                finishSyncVisuals(systemStatus, syncLabel);
                return;
            }
            lastDataHash = currentHash;

            const container = document.getElementById('user-list');
            const totalCounter = document.getElementById('total-users');
            
            // Convertimos el JSON a Array
            const userArray = Object.entries(users);
            totalCounter.innerText = `${userArray.length} / ${MAX_SLOTS}`;
            
            container.innerHTML = '';

            // BUCLE DE GENERACIÓN DE 10 TARJETAS (Slots)
            for (let i = 0; i < MAX_SLOTS; i++) {
                if (i < userArray.length) {
                    // --- NODO OCUPADO (Usuario Real) ---
                    const [email, data] = userArray[i];
                    const isMaster = data.node_id === 'MASTER';
                    
                    // Datos de Google o Fallback
                    const displayName = data.google_name || email.split('@')[0];
                    const displayPhoto = (data.google_photo && data.google_photo.length > 5) 
                        ? `<img src="${data.google_photo}" alt="${displayName}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=random'">` 
                        : `<img src="https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=random" alt="${displayName}">`;

                    const card = document.createElement('div');
                    card.className = `user-card ${isMaster ? 'master-card' : ''}`;
                    card.style.setProperty('--node-color', data.color || '#00ffff');

                    card.innerHTML = `
                        <div class="card-header">
                            <div class="card-avatar">${displayPhoto}</div>
                            <div class="user-info">
                                <div class="card-name">${displayName}</div>
                                <div class="card-email" title="${email}">${email}</div>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="node-badge-container">
                                <span class="node-badge">NODO: ${data.node_id}</span>
                                <span style="width:8px; height:8px; background:#4ade80; border-radius:50%; box-shadow:0 0 5px #4ade80;"></span>
                            </div>
                            <p class="role-desc">${data.role}</p>
                            
                            ${!isMaster ? `
                                <div class="admin-controls">
                                    <span class="control-label">Asignar Nueva Jerarquía:</span>
                                    <select class="role-select" onchange="enableSave(this)">
                                        <option value="" disabled selected>Seleccionar...</option>
                                        <option value="ALPHA">ALPHA (Gobernanza)</option>
                                        <option value="BETA">BETA (Finanzas)</option>
                                        <option value="GAMMA">GAMMA (Pedagogía)</option>
                                        <option value="DELTA">DELTA (Tecnología)</option>
                                        <option value="EPSILON">EPSILON (Bienestar)</option>
                                    </select>
                                    <button class="btn-save" onclick="updateRole('${email}', this)">GUARDAR CAMBIOS</button>
                                </div>
                            ` : `
                                <div style="margin-top:auto; text-align:center; padding:10px; border:1px dashed #ffd700; border-radius:8px; color:#ffd700; font-size:0.6rem; font-weight:bold;">
                                    👑 ADMIN SUPREMO
                                </div>
                            `}
                        </div>
                    `;
                    container.appendChild(card);

                } else {
                    // --- NODO VACANTE (Slot Disponible) ---
                    const emptyCard = document.createElement('div');
                    emptyCard.className = 'user-card vacant';
                    emptyCard.innerHTML = `
                        <div class="vacant-icon">⦿</div>
                        <div class="vacant-text">NODO ${i + 1} DISPONIBLE</div>
                        <div class="vacant-sub">Esperando conexión cuántica...</div>
                    `;
                    container.appendChild(emptyCard);
                }
            }

            finishSyncVisuals(systemStatus, syncLabel);

        } catch (error) {
            console.error("Fallo de sincronización:", error);
            systemStatus.innerText = "ERROR_LINK";
            systemStatus.style.color = "#ef4444";
        }
    }

    function finishSyncVisuals(statusEl, labelEl) {
        setTimeout(() => {
            statusEl.classList.remove('syncing-effect');
            statusEl.innerText = "EN LÍNEA";
            statusEl.style.color = "#4ade80";
            labelEl.innerText = "Sincronización: Activa";
        }, 500);
    }

    function enableSave(selectElement) {
        const btn = selectElement.nextElementSibling;
        if(btn) btn.classList.add('active');
    }

    async function updateRole(email, btnElement) {
        if(!btnElement.classList.contains('active')) return;
        
        const select = btnElement.previousElementSibling;
        const newNodeId = select.value;
        if(!newNodeId) return;

        const originalText = btnElement.innerText;
        btnElement.innerText = "SINCRONIZANDO...";
        btnElement.style.opacity = "0.7";
        
        try {
            const baseUrl = window.location.origin;
            const response = await fetch(`${baseUrl}/api/admin/assign_node`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, node_id: newNodeId })
            });
            
            if (response.ok) {
                btnElement.innerText = "¡EXITO!";
                btnElement.style.background = "#4ade80";
                btnElement.style.color = "#000";
                btnElement.style.opacity = "1";
                
                // Forzar recarga inmediata
                lastDataHash = "";
                loadUsers();
            } else {
                alert("Error al asignar");
                btnElement.innerText = originalText;
                btnElement.style.opacity = "1";
            }
        } catch (e) {
            console.error(e);
            alert("Error de red.");
            btnElement.innerText = "ERROR";
        }
    }
</script>
{% endblock %}
